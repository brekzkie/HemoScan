# ================================================================
# docker-compose.yml — HemoScan Full Stack
#
# Cara pakai:
#   docker compose up --build       ← pertama kali / setelah ada perubahan kode
#   docker compose up               ← selanjutnya
#   docker compose down             ← matikan semua container
#   docker compose down -v          ← matikan + hapus data database
# ================================================================

services:

  # ── PostgreSQL Database ───────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: hemoscan_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hemoscan_pass
      POSTGRES_DB: hemoscan
    volumes:
      - hemoscan_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hemoscan_net

  # ── FastAPI Application ───────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hemoscan_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: hemoscan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hemoscan_pass
      TF_ENABLE_ONEDNN_OPTS: 0
      TF_CPP_MIN_LOG_LEVEL: 2
    volumes:
      # Upload gambar hasil scan disimpan permanen di luar container
      - hemoscan_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hemoscan_net

# ── Persistent Volumes ────────────────────────────────────────
volumes:
  hemoscan_pgdata:
    driver: local
  hemoscan_uploads:
    driver: local

# ── Network ───────────────────────────────────────────────────
networks:
  hemoscan_net:
    driver: bridge
